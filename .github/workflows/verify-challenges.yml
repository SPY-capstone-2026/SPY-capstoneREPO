name: Verify challenges (daily 00:05 KST)

# 챌린지 자정 정산을 깨우는 스케줄러.
# 서버 안에서 도는 스케줄러(APScheduler 등)는 Render 무료 플랜이 슬립하거나 OOM으로 재시작되면
# 그 시간대 실행이 통째로 사라진다. 그래서 '서버 밖'에서 시간에 맞춰 API를 호출한다.
# 호출이 늦어지거나 중복돼도 정산 API가 멱등이라 안전하다.

on:
  schedule:
    # GitHub cron 은 UTC. 15:05 UTC = 00:05 KST.
    # 정각(:00)은 GitHub 쪽이 몰려서 지연이 잦으니 5분 비켜 두었다.
    - cron: "5 15 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행(시연/점검용)

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call challenge verification endpoint
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}   # 예: https://spy-capstonerepo.onrender.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Render 무료 서버는 슬립에서 깨어나는 데 최대 1분 이상 걸릴 수 있어서
          # 타임아웃을 넉넉히 두고, 실패하면 간격을 두고 재시도한다.
          curl --fail-with-body --silent --show-error \
            --max-time 180 \
            --retry 5 --retry-delay 30 --retry-all-errors \
            -X POST "$API_BASE_URL/internal/challenges/verify" \
            -H "X-Cron-Secret: $CRON_SECRET"
